# Notify (correo por SMTP), Mailpit (buzón local) y publicación de comandos desde Orders.
# Usar junto a compose.rabbitmq.yml, que define el broker; este archivo ya no lo incluye.
# Orden completo de los archivos en docs/RABBITMQ.md.
services:
  mailpit:
    image: axllent/mailpit:v1.30.6
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    volumes:
      - mailpit_data:/data

  orders:
    environment:
      ORDERS_NOTIFICATIONS_ENABLED: "true"
      ORDERS_NOTIFICATIONS_MAX_ATTEMPTS: ${ORDERS_NOTIFICATIONS_MAX_ATTEMPTS:-20}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Define RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-pedidos360}
      RABBITMQ_EMAIL_QUEUE: ${RABBITMQ_EMAIL_QUEUE:-q.cmd.email}
      RABBITMQ_EMAIL_DLQ: ${RABBITMQ_EMAIL_DLQ:-q.cmd.email.dlq}

  notify:
    build: ./ms-pedidos360-notify
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Define RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-pedidos360}
      RABBITMQ_EMAIL_QUEUE: ${RABBITMQ_EMAIL_QUEUE:-q.cmd.email}
      RABBITMQ_EMAIL_DLQ: ${RABBITMQ_EMAIL_DLQ:-q.cmd.email.dlq}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFY_EMAIL_FROM: ${NOTIFY_EMAIL_FROM:-no-reply@pedidos360.test}
      NOTIFY_EMAIL_RECIPIENT: ${NOTIFY_EMAIL_RECIPIENT:-demo@pedidos360.test}
    ports:
      - "127.0.0.1:${NOTIFY_PORT:-8083}:8083"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  mailpit_data:
