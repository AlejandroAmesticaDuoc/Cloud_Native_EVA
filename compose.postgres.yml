name: pedidos360-local

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Define POSTGRES_ADMIN_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Define CATALOG_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      # Disponible solo en este computador, no en todas las interfaces de red.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/001-create-catalog.sh:/docker-entrypoint-initdb.d/001-create-catalog.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${CATALOG_DB_PASSWORD}\" psql -h 127.0.0.1 -U pedidos360_catalog -d pedidos360_catalog -Atqc 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
