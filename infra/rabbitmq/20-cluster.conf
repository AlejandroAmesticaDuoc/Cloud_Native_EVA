# Clúster de dos nodos de Pedidos360 (montado en /etc/rabbitmq/conf.d por compose.rabbitmq.yml).
# Un nodo nuevo busca a los demás de esta lista y se une al que ya está en marcha; un nodo que ya
# pertenece al clúster la ignora al reiniciar. Los nombres usan el hostname de cada contenedor.
cluster_name = pedidos360
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@pedidos360-rabbitmq
cluster_formation.classic_config.nodes.2 = rabbit@pedidos360-rabbitmq-2
