spring.application.name=ms-pedidos360-audit
server.port=${AUDIT_PORT:8085}
server.address=${AUDIT_BIND_ADDRESS:127.0.0.1}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:00000000-0000-0000-0000-000000000000}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.paths-to-match=/api/v1/audit/**
springdoc.override-with-generic-response=false
spring.datasource.url=${AUDIT_DB_URL:jdbc:postgresql://localhost:5434/pedidos360_audit}
spring.datasource.username=${AUDIT_DB_USERNAME:pedidos360_audit}
spring.datasource.password=${AUDIT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=10
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,auditConsumer
audit.events.enabled=${AUDIT_EVENTS_ENABLED:true}
audit.events.topic=${KAFKA_ORDERS_TOPIC:orders.events}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.client-id=pedidos360-audit
spring.kafka.admin.auto-create=false
spring.kafka.consumer.group-id=${AUDIT_KAFKA_GROUP:pedidos360-audit-v1}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=20
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties[allow.auto.create.topics]=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.log-container-config=false
spring.kafka.listener.missing-topics-fatal=false
