spring.application.name=ms-pedidos360-catalog

# Puerto del microservicio
server.port=${CATALOG_PORT:8082}
server.address=${CATALOG_BIND_ADDRESS:127.0.0.1}
spring.jackson.deserialization.fail-on-unknown-properties=true

# Mismo emisor y audiencia que el BFF: el token original se valida nuevamente.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:00000000-0000-0000-0000-000000000000}

springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.paths-to-match=/api/v1/catalog/**,/internal/v1/catalog/**
springdoc.override-with-generic-response=false

# Cada microservicio administra su propia base y usuario.
spring.datasource.url=${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/pedidos360_catalog}
spring.datasource.username=${CATALOG_DB_USERNAME:pedidos360_catalog}
spring.datasource.password=${CATALOG_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000

# Flyway crea y versiona las tablas; Hibernate solo comprueba el esquema.
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Exponer solamente el endpoint de salud por HTTP
management.endpoints.web.exposure.include=health

# No mostrar detalles internos de los componentes
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Si la base deja de responder, Catalog no está listo para atender pedidos.
management.endpoint.health.group.readiness.include=readinessState,db
