spring.application.name=ms-pedidos360-catalog

# Puerto del microservicio
server.port=${CATALOG_PORT:8082}
server.address=${CATALOG_BIND_ADDRESS:127.0.0.1}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

# Mismo emisor y audiencia que el BFF: el token original se valida nuevamente.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:00000000-0000-0000-0000-000000000000}
catalog.orders-client-id=${ORDERS_SERVICE_CLIENT_ID:}

springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.paths-to-match=/api/v1/catalog/**,/internal/v1/catalog/**
springdoc.override-with-generic-response=false

# Cada microservicio administra su propia base y usuario.
spring.datasource.url=${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/pedidos360_catalog}
spring.datasource.username=${CATALOG_DB_USERNAME:pedidos360_catalog}
spring.datasource.password=${CATALOG_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000

# Flyway crea y versiona las tablas; Hibernate solo comprueba el esquema.
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Exponer solamente el endpoint de salud por HTTP
management.endpoints.web.exposure.include=health

# No mostrar detalles internos de los componentes
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Si la base deja de responder, Catalog no está listo para atender pedidos.
management.endpoint.health.group.readiness.include=readinessState,db

# RabbitMQ: consumidor de tickets de cocina (q.cmd.kitchen). Con el interruptor en false no se crea
# ningún bean de topología ni listener y no se abre conexión con el broker.
catalog.commands.enabled=${CATALOG_COMMANDS_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:pedidos360}
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.dynamic=${catalog.commands.enabled}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=false
# La API HTTP de Catalog no depende del broker.
management.health.rabbit.enabled=false

# Topología RabbitMQ (contrato compartido): única fuente de nombres de exchanges, colas y routing keys.
messaging.exchanges.direct=cmd.direct
messaging.exchanges.topic=cmd.topic
messaging.exchanges.dead-letter=cmd.dead.dlx
messaging.routes.kitchen.queue=q.cmd.kitchen
messaging.routes.kitchen.dlq=q.cmd.kitchen.dlq
messaging.routes.kitchen.routing-key=kitchen.ticket
messaging.routes.kitchen.topic-pattern=kitchen.#
messaging.queues.max-length=10000
messaging.queues.dead-letter-ttl=7d
messaging.queues.dead-letter-max-length=10000
messaging.consumer.prefetch=1
messaging.consumer.max-payload-bytes=32768
messaging.consumer.retry.max-attempts=3
messaging.consumer.retry.initial-interval=1s
messaging.consumer.retry.multiplier=2
messaging.consumer.retry.max-interval=4s
