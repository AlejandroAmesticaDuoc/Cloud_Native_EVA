# Solo existe en el classpath de pruebas; no se empaqueta en la aplicación.
spring.datasource.url=jdbc:h2:mem:catalog_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Se ejecuta la misma migración y validación del esquema que en PostgreSQL.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
