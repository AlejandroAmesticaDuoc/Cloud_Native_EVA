spring.application.name=ms-pedidos360-kafka-admin

# Puerto del microservicio administrador de Kafka
server.port=${KAFKA_ADMIN_PORT:8087}
server.address=${KAFKA_ADMIN_BIND_ADDRESS:127.0.0.1}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

# Mismo emisor y audiencia que el BFF: el token original se valida nuevamente.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:00000000-0000-0000-0000-000000000000}

springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.paths-to-match=/api/v1/kafka-admin/**
springdoc.override-with-generic-response=false

# Cliente Admin de Kafka: conexión a los tres brokers del compose y timeouts acotados para responder 503
# rápido si el clúster no está disponible.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.client-id=pedidos360-kafka-admin
spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false
spring.kafka.admin.properties[request.timeout.ms]=5000
spring.kafka.admin.properties[default.api.timeout.ms]=10000
spring.kafka.admin.properties[retries]=2

# Tiempo máximo que espera cada operación administrativa.
kafkaadmin.operation-timeout=10s
# Límites de validación para crear o ampliar tópicos.
kafkaadmin.max-partitions=50
kafkaadmin.max-replication-factor=3
# Tópicos base del sistema: se pueden consultar y modificar sus configuraciones, pero no eliminar ni
# cambiar su número de particiones (rompería el orden por pedido). Los internos (__*) siempre están protegidos.
kafkaadmin.protected-topics=${KAFKA_ORDERS_TOPIC:orders.events},${KAFKA_TIMELINE_TOPIC:audit.timeline},\
  ${KAFKA_ORDERS_TOPIC:orders.events}.audit.DLT,${KAFKA_ORDERS_TOPIC:orders.events}.report.DLT,\
  ${KAFKA_TIMELINE_TOPIC:audit.timeline}.report.DLT
# Configuraciones de tópico que la API permite crear o modificar.
kafkaadmin.allowed-configs=retention.ms,retention.bytes,cleanup.policy,min.insync.replicas,segment.ms,\
  segment.bytes,max.message.bytes,compression.type,delete.retention.ms,min.compaction.lag.ms,max.compaction.lag.ms

# Exponer solamente el endpoint de salud por HTTP
management.endpoints.web.exposure.include=health

# No mostrar detalles internos de los componentes
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true

# Sin clúster Kafka, el administrador no puede trabajar: forma parte de readiness.
management.endpoint.health.group.readiness.include=readinessState,kafkaCluster
