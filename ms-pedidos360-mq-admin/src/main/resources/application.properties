spring.application.name=ms-pedidos360-mq-admin

# Puerto del microservicio administrador de RabbitMQ
server.port=${MQ_ADMIN_PORT:8086}
server.address=${MQ_ADMIN_BIND_ADDRESS:127.0.0.1}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false

# Mismo emisor y audiencia que el BFF: el token original se valida nuevamente.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:00000000-0000-0000-0000-000000000000}

springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.paths-to-match=/api/v1/mq-admin/**
springdoc.override-with-generic-response=false

# Conexión AMQP: credenciales solo por variables de entorno.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:pedidos360}
spring.rabbitmq.connection-timeout=3s

# API HTTP de management (lecturas y verificación de existencia). Usa las mismas credenciales.
mqadmin.management-url=${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
mqadmin.management-timeout=3s
# Tiempo máximo para esperar la confirmación (publisher confirm) al reenviar desde una DLQ.
mqadmin.replay-confirm-timeout=5s
# Exchange de dead letters: un mensaje que murió en una cola de auditoría se reenvía directo a esa cola.
mqadmin.dead-letter-exchange=cmd.dead.dlx

# Topología base del contrato: no se puede eliminar desde la API (409).
mqadmin.protected-resources=cmd.direct,cmd.topic,cmd.dead.dlx,\
  ${RABBITMQ_EMAIL_QUEUE:q.cmd.email},${RABBITMQ_EMAIL_DLQ:q.cmd.email.dlq},\
  q.cmd.kitchen,q.cmd.kitchen.dlq,q.cmd.invoice,q.cmd.invoice.dlq,\
  q.audit.dead-letters,q.audit.dead-letters.dlq

# DLQ vigiladas por DeadLetterMonitor y habilitadas para replay.
mqadmin.alerts.dead-letter-queues=${RABBITMQ_EMAIL_DLQ:q.cmd.email.dlq},q.cmd.kitchen.dlq,\
  q.cmd.invoice.dlq,q.audit.dead-letters.dlq
mqadmin.alerts.threshold=${MQ_ADMIN_ALERT_THRESHOLD:1}
mqadmin.alerts.interval=${MQ_ADMIN_ALERT_INTERVAL:30s}

# Exponer solamente el endpoint de salud por HTTP
management.endpoints.web.exposure.include=health

# No mostrar detalles internos de los componentes
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true

# Sin broker, mq-admin no puede administrar nada: RabbitMQ forma parte de readiness.
management.endpoint.health.group.readiness.include=readinessState,rabbit
