spring.application.name=ms-pedidos360-notify
server.port=${NOTIFY_PORT:8083}
server.address=${NOTIFY_BIND_ADDRESS:127.0.0.1}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
# Topologia RabbitMQ (contrato compartido): unica fuente de nombres de exchanges, colas y routing keys.
messaging.exchanges.direct=cmd.direct
messaging.exchanges.topic=cmd.topic
messaging.exchanges.dead-letter=cmd.dead.dlx
messaging.routes.email.queue=${RABBITMQ_EMAIL_QUEUE:q.cmd.email}
messaging.routes.email.dlq=${RABBITMQ_EMAIL_DLQ:q.cmd.email.dlq}
messaging.routes.email.routing-key=email.send
messaging.routes.email.topic-pattern=email.#
messaging.queues.max-length=10000
messaging.queues.dead-letter-ttl=7d
messaging.queues.dead-letter-max-length=10000
# Consumidor: ACK manual, reintento local acotado y luego DLQ (ver ManualAckHandler).
messaging.consumer.prefetch=1
messaging.consumer.max-payload-bytes=8192
messaging.consumer.idempotency-cache-size=10000
messaging.consumer.retry.max-attempts=3
messaging.consumer.retry.initial-interval=1s
messaging.consumer.retry.multiplier=2
messaging.consumer.retry.max-interval=4s
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:pedidos360}
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=false
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
notify.email.from=${NOTIFY_EMAIL_FROM:no-reply@pedidos360.test}
notify.email.recipient=${NOTIFY_EMAIL_RECIPIENT:demo@pedidos360.test}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,rabbit,mail
