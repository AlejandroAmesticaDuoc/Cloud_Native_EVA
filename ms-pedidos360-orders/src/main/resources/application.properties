spring.application.name=ms-pedidos360-orders
server.port=${ORDERS_PORT:8081}
server.address=${ORDERS_BIND_ADDRESS:127.0.0.1}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:00000000-0000-0000-0000-000000000000}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.paths-to-match=/api/v1/orders/**
springdoc.override-with-generic-response=false
spring.datasource.url=${ORDERS_DB_URL:jdbc:postgresql://localhost:5433/pedidos360_orders}
spring.datasource.username=${ORDERS_DB_USERNAME:pedidos360_orders}
spring.datasource.password=${ORDERS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.readiness.include=readinessState,db
orders.catalog.base-url=${CATALOG_SERVICE_URL:http://localhost:8082}
orders.catalog.connect-timeout=${ORDERS_HTTP_CONNECT_TIMEOUT:2s}
orders.catalog.read-timeout=${ORDERS_HTTP_READ_TIMEOUT:3s}
orders.catalog.client-id=${ORDERS_SERVICE_CLIENT_ID:}
orders.catalog.client-secret=${ORDERS_SERVICE_CLIENT_SECRET:}
orders.catalog.token-uri=${ORDERS_TOKEN_URI:}
orders.catalog.scope=${ORDERS_CATALOG_SCOPE:}
orders.notifications.enabled=${ORDERS_NOTIFICATIONS_ENABLED:false}
orders.notifications.poll-delay=${ORDERS_NOTIFICATIONS_POLL_DELAY:1000}
messaging.email.queue=${RABBITMQ_EMAIL_QUEUE:q.cmd.email}
messaging.email.dlq=${RABBITMQ_EMAIL_DLQ:q.cmd.email.dlq}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:pedidos360}
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.dynamic=${orders.notifications.enabled}
management.health.rabbit.enabled=false
orders.events.enabled=${ORDERS_EVENTS_ENABLED:false}
orders.events.topic=${KAFKA_ORDERS_TOPIC:orders.events}
orders.events.poll-delay=${ORDERS_EVENTS_POLL_DELAY:1000}
spring.task.scheduling.pool.size=2
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.client-id=pedidos360-orders
spring.kafka.admin.auto-create=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[max.in.flight.requests.per.connection]=1
spring.kafka.producer.properties[max.block.ms]=3000
spring.kafka.producer.properties[request.timeout.ms]=3000
spring.kafka.producer.properties[delivery.timeout.ms]=5000
spring.kafka.producer.properties[linger.ms]=0
