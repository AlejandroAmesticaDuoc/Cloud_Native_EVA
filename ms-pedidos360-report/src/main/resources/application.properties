spring.application.name=ms-pedidos360-report
server.port=${REPORT_PORT:8084}
server.address=${REPORT_BIND_ADDRESS:127.0.0.1}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://login.microsoftonline.com/common/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${JWT_AUDIENCE:00000000-0000-0000-0000-000000000000}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.paths-to-match=/api/v1/reports/**
springdoc.override-with-generic-response=false
spring.datasource.url=${REPORT_DB_URL:jdbc:postgresql://localhost:5435/pedidos360_report}
spring.datasource.username=${REPORT_DB_USERNAME:pedidos360_report}
spring.datasource.password=${REPORT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=10
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,reportConsumer
# ---------------------------------------------------------------------------------------------
# Kafka. Dos consumidores con grupos distintos:
#  - orders.events  -> proyección de pedidos para KPIs (grupo REPORT_KAFKA_GROUP)
#  - audit.timeline -> métricas de actividad en tiempo real (grupo REPORT_TIMELINE_KAFKA_GROUP)
# Mensajes inválidos -> <tópico>.report.DLT. Report no publica eventos de negocio, solo a sus DLT.
# ---------------------------------------------------------------------------------------------
report.events.enabled=${REPORT_EVENTS_ENABLED:true}
report.events.topic=${KAFKA_ORDERS_TOPIC:orders.events}
report.events.retry.max-retries=3
report.events.retry.initial-interval-ms=1000
report.events.retry.max-interval-ms=30000
report.timeline.enabled=${REPORT_TIMELINE_ENABLED:true}
report.timeline.topic=${KAFKA_TIMELINE_TOPIC:audit.timeline}
report.timeline.group=${REPORT_TIMELINE_KAFKA_GROUP:pedidos360-report-timeline-v1}
report.dead-letter-suffix=.report.DLT
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.client-id=pedidos360-report
spring.kafka.admin.auto-create=false
# Consumidor: clave String y valor como DTO validado. El delegado por defecto es OrderEventDeserializer;
# el listener de audit.timeline lo reemplaza por AuditTimelineDeserializer.
spring.kafka.consumer.group-id=${REPORT_KAFKA_GROUP:pedidos360-report-v1}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=20
spring.kafka.consumer.isolation-level=read-committed
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=cl.duoc.pedidos360.report.messaging.OrderEventDeserializer
spring.kafka.consumer.properties[allow.auto.create.topics]=false
spring.kafka.consumer.properties[partition.assignment.strategy]=org.apache.kafka.clients.consumer.CooperativeStickyAssignor
spring.kafka.consumer.properties[session.timeout.ms]=30000
spring.kafka.consumer.properties[heartbeat.interval.ms]=3000
spring.kafka.consumer.properties[max.poll.interval.ms]=300000
# Una hebra por partición (3); varias instancias de Report con el mismo grupo se reparten las particiones.
spring.kafka.listener.concurrency=3
spring.kafka.listener.ack-mode=record
spring.kafka.listener.log-container-config=false
spring.kafka.listener.missing-topics-fatal=false
# Productor solo para las DLT (serializer por tipo en KafkaProducerConfig).
spring.kafka.producer.acks=all
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[max.in.flight.requests.per.connection]=1
spring.kafka.producer.properties[max.block.ms]=5000
spring.kafka.producer.properties[request.timeout.ms]=5000
spring.kafka.producer.properties[delivery.timeout.ms]=10000
# RabbitMQ: consumidor de boletas (q.cmd.invoice). Con el interruptor en false no se crea ningun bean de
# topologia ni listener y no se abre conexion con el broker. La API HTTP no depende del broker.
report.commands.enabled=${REPORT_COMMANDS_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:pedidos360}
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.dynamic=${report.commands.enabled}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=false
management.health.rabbit.enabled=false
# Topologia RabbitMQ (contrato compartido): unica fuente de nombres de exchanges, colas y routing keys.
messaging.exchanges.direct=cmd.direct
messaging.exchanges.topic=cmd.topic
messaging.exchanges.dead-letter=cmd.dead.dlx
messaging.routes.invoice.queue=q.cmd.invoice
messaging.routes.invoice.dlq=q.cmd.invoice.dlq
messaging.routes.invoice.routing-key=invoice.gen
messaging.routes.invoice.topic-pattern=invoice.#
messaging.queues.max-length=10000
messaging.queues.dead-letter-ttl=7d
messaging.queues.dead-letter-max-length=10000
messaging.consumer.prefetch=1
messaging.consumer.max-payload-bytes=32768
messaging.consumer.retry.max-attempts=3
messaging.consumer.retry.initial-interval=1s
messaging.consumer.retry.multiplier=2
messaging.consumer.retry.max-interval=4s
